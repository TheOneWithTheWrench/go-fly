version: 2
project_name: go-fly

before:
  hooks:
    - go mod tidy

builds:
  - id: go-fly
    main: ./cmd/fly
    binary: fly
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    builds:
      - go-fly
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

release:
  draft: false

brews:
  - name: go-fly
    homepage: https://github.com/TheOneWithTheWrench/go-fly
    description: "Fast CLI to jump to local git repos by name"
    repository:
      owner: TheOneWithTheWrench
      name: tap
      token: "{{ .Env.GORELEASER_GITHUB_TOKEN }}"
    directory: Formula
    license: MIT
    install: |
      bin.install "fly"
